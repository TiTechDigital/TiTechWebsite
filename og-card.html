<!doctype html>
<!--
  Source of the social preview cards (1200x630), rendered headlessly:
  chrome --headless=new --window-size=1200,630 --force-device-scale-factor=1 ^
    --screenshot="assets/img/og-card-it-1200x630.png" "http://127.0.0.1:8080/og-card.html"
  Add ?lang=en for the English card. Not deployed (see .vercelignore).
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>TiTech Digital: social card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800&family=Onest:wght@400;600&display=swap">
<style>
:root { --ink: #f7f8f6; --muted: #b7c0c9; --accent: #315cdb; --bg: #101923; }
html, body { margin: 0; padding: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden; position: relative;
  background: var(--bg); color: var(--ink);
  font-family: "Onest", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.glow {
  position: absolute; z-index: 0; right: -170px; top: -250px; width: 740px; height: 740px; border-radius: 50%;
  background: radial-gradient(circle at 60% 62%, #315cdb 0%, #2746b4 34%, rgba(16, 25, 35, 0) 68%);
}
.ring {
  position: absolute; z-index: 1; right: 118px; top: 92px; width: 396px; height: 396px; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
}
.shot {
  position: absolute; z-index: 1; right: 138px; top: 112px; width: 356px; height: 356px; border-radius: 50%;
  overflow: hidden; background: #25313c;
}
.shot img { width: 100%; height: 100%; object-fit: cover; opacity: .92; }
.card {
  position: relative; z-index: 2; box-sizing: border-box; height: 100%;
  padding: 62px 76px 54px; display: flex; flex-direction: column; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 38px; height: 38px; }
.brand span {
  font-family: "Gabarito", "Arial Black", Arial, sans-serif; font-weight: 800;
  font-size: 26px; letter-spacing: -.02em;
}
.word {
  margin: 0; font-family: "Gabarito", "Arial Black", Arial, sans-serif; font-weight: 800;
  font-size: 188px; line-height: .82; letter-spacing: -.062em;
}
.dot {
  display: inline-block; width: .185em; height: .185em; margin-left: .05em;
  border-radius: 50%; background: var(--accent);
}
.lead { margin: 28px 0 0; max-width: 552px; font-size: 28px; line-height: 1.36; color: var(--muted); }
.foot {
  display: flex; align-items: baseline; justify-content: space-between; gap: 32px;
  padding-top: 20px; border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
  font-size: 17px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="ring" aria-hidden="true"></div>
<div class="shot" aria-hidden="true"><img src="assets/img/hero-1400.webp" alt=""></div>
<div class="card">
  <div class="brand"><img src="assets/img/logo.svg" alt=""><span>TiTech Digital</span></div>
  <div>
    <p class="word">TiTech<span class="dot"></span></p>
    <p class="lead" id="lead">Tecnologia e soluzioni digitali per le imprese</p>
  </div>
  <div class="foot"><span id="kicker">Partner tecnologico · titechdigital.it</span><span id="tags">Siti web · E-commerce · Software</span></div>
</div>
<script>
if (new URLSearchParams(location.search).get('lang') === 'en') {
  document.documentElement.lang = 'en';
  document.getElementById('lead').textContent = 'Technology and digital solutions for businesses';
  document.getElementById('kicker').textContent = 'Technology partner · titechdigital.it';
  document.getElementById('tags').textContent = 'Websites · E-commerce · Software';
}
</script>
</body>
</html>
