name: Publish scheduled articles

# Every morning: publish the articles of the SEO editorial calendar whose date has come
# (tools/publish_scheduled.py moves them out of _scheduled/ and registers them), check the site,
# and push to main: Vercel deploys the new pages.
on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC = 06:00 or 07:00 in Italy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish what is due
        run: python tools/publish_scheduled.py
      - name: Check the site
        run: |
          python tools/check_site.py
          python tools/selftest.py
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "TiTech Digital publisher"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Publish scheduled articles ($(date -u +%F))"
            git push origin HEAD:main
          else
            echo "Nothing due today."
          fi
